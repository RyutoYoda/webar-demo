<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebAR Demo - preview (AR なし)</title>
<link rel="icon" href="data:,">
<script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
<script src="./js/lineage-overlay.js"></script>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; }
  .a-enter-vr { display: none !important; }
  #note {
    position: fixed; left: 0; right: 0; top: 0; z-index: 10; padding: 10px 14px;
    background: rgba(12, 14, 18, 0.78); color: #eef1f5;
    font: 13px/1.6 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
  }
  #note a { color: #7fc2f5; }
</style>
</head>
<body>

<div id="note">
  カメラとマーカーを使わずに、<b>ARで出るのと同じ中身</b>を表示しています。
  ドラッグで視点変更、WASDで移動。 → <a href="./index.html">AR版はこちら</a>
</div>

<a-scene background="color: #11141a" renderer="colorManagement: true; antialias: true">
  <a-assets>
    <a-asset-item id="dag" src="./models/pipeline_dag.glb"></a-asset-item>
  </a-assets>

  <a-entity light="type: ambient; color: #9aa3b4; intensity: 0.95"></a-entity>
  <a-entity light="type: directional; intensity: 0.7" position="1 2 1"></a-entity>

  <!-- ARではマーカーを机に平置きして上から見下ろすので、ラベルは面に寝かせてある。
       このページにはマーカーが無く正面から見ることになるため、グラフの面ごと
       手前に倒して、見下ろしているのと同じ角度になるようにしている。
       内側のY回転は、机の上でグラフを回しているのと同じ向きの首振り。 -->
  <a-entity position="0 1.36 -2.8" rotation="42 0 0" scale="1.3 1.3 1.3">
    <a-entity lineage-overlay
              animation="property: rotation; from: 0 -16 0; to: 0 16 0;
                         dur: 10000; dir: alternate; loop: true; easing: easeInOutSine"></a-entity>
  </a-entity>

  <!-- 画角を狭めて遠くから撮っている。既定の80度だと手前のノードだけ極端に
       大きくなり、グラフの形が読み取れなくなるため -->
  <a-entity camera="fov: 45" look-controls wasd-controls position="0 1.6 0"></a-entity>
</a-scene>

</body>
</html>
