<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>WebAR Demo - Data Pipeline Lineage</title>
<link rel="icon" href="data:,">

<!-- A-Frame と AR.js。どちらもCDNから読むだけで、ビルド工程は無い -->
<script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>
<script src="./js/lineage-overlay.js"></script>

<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #000; }
  .a-enter-vr, .a-enter-ar { display: none !important; }

  #hint {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    box-sizing: border-box;
    background: rgba(12, 14, 18, 0.82);
    color: #eef1f5;
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    transition: opacity .25s;
  }
  #hint.found { opacity: 0; pointer-events: none; }
  #hint b { color: #7fc2f5; font-weight: 600; }
  #hint a { color: #7fc2f5; }
  #hint .row { margin-top: 6px; }
  #hint .mk { display: inline-block; width: 46px; height: 46px; vertical-align: middle;
              margin-right: 8px; border-radius: 4px; background: #fff; }
</style>
</head>
<body>

<a-scene
  embedded
  vr-mode-ui="enabled: false"
  renderer="colorManagement: true; antialias: true"
  arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono; patternRatio: 0.5">

  <a-assets>
    <!-- tools/build_model.py が生成した立体物 -->
    <a-asset-item id="dag" src="./models/pipeline_dag.glb"></a-asset-item>
  </a-assets>

  <!-- LT1のタスク14で作った自作マーカー -->
  <a-marker id="marker-custom" type="pattern" url="./marker/my-icon-marker.patt"
            lineage-overlay="hint: #hint"></a-marker>

  <!-- AR.js 標準の hiro マーカー。自作マーカーが手元に無くても試せるように両対応にしてある -->
  <a-marker id="marker-hiro" preset="hiro"
            lineage-overlay="hint: #hint"></a-marker>

  <a-entity camera></a-entity>
</a-scene>

<div id="hint">
  <img class="mk" src="./marker/my-icon-marker.png" alt="マーカー">
  <b>マーカーをカメラに映してください。</b>
  別の画面に表示するか、印刷したものを使います。
  <div class="row">
    マーカー画像：<a href="./marker/my-icon-marker.png" target="_blank">自作マーカー</a> ／
    <a href="https://raw.githack.com/AR-js-org/AR.js/master/data/images/hiro.png" target="_blank">hiro（標準）</a>
    — どちらでも同じものが出ます。
  </div>
  <div class="row">
    カメラが使えない場合は <a href="./preview.html">preview.html</a> で同じ立体物を見られます。
  </div>
</div>

</body>
</html>
